<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admissions Closed — {{ school.name|default:"PrimeSoul School" }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #F3F4F6; color: #1F2937; }
    .card { border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: none; }
  </style>
</head>
<body>

<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-6 text-center">
      <div class="card p-5">
        <div class="mb-4">
          <i class="fas fa-calendar-times text-warning" style="font-size: 4rem;"></i>
        </div>
        <h3 class="font-weight-bold text-dark mb-2">Admissions Are Currently Closed</h3>
        <p class="text-muted mb-4">Online applications for <strong>{{ school.name|default:"the institution" }}</strong> are not currently accepting submissions. Please check back during the next intake cycle or contact the school admissions office directly.</p>

        <a href="{% url 'admissions:public_status' %}" class="btn btn-outline-primary font-weight-bold">
          <i class="fas fa-search mr-1"></i> Track Existing Application
        </a>
      </div>
    </div>
  </div>
</div>

</body>
</html>
