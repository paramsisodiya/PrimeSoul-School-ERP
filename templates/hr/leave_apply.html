{% extends 'dashboard.html' %}
{% load static crispy_forms_tags %}

{% block dashboard-body %}
<div class="container-fluid px-0">

  <div class="d-flex align-items-center justify-content-between flex-wrap pb-3 mb-3 border-bottom">
    <div>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb bg-transparent p-0 mb-1" style="font-size: 0.85rem;">
          <li class="breadcrumb-item"><a href="{% url 'index_view' %}">Dashboard</a></li>
          <li class="breadcrumb-item"><a href="{% url 'hr:leaves' %}">Leaves</a></li>
          <li class="breadcrumb-item active" aria-current="page">Apply</li>
        </ol>
      </nav>
      <h4 class="font-weight-bold text-dark mb-0">Apply for Leave</h4>
    </div>
    <div>
      <a href="{% url 'hr:leaves' %}" class="btn btn-outline-secondary btn-sm">
        <i class="fas fa-times mr-1"></i> Cancel
      </a>
    </div>
  </div>

  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card shadow-sm border-0" style="border-radius: 10px;">
        <div class="card-header bg-white font-weight-bold">
          <i class="fas fa-envelope-open-text mr-1 text-primary"></i> Leave Application Form
        </div>
        <div class="card-body p-4">
          <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="mt-4 pt-3 border-top text-right">
              <a href="{% url 'hr:leaves' %}" class="btn btn-secondary mr-2">Cancel</a>
              <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane mr-1"></i> Submit Application</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

</div>
{% endblock %}
