{% if messages %}
<div id="primesoul-toast-container" class="primesoul-toast-container" aria-live="polite" aria-atomic="true">
  {% for message in messages %}
    <div class="primesoul-toast primesoul-toast-{{ message.tags|default:'info' }} shadow-lg" role="alert" data-autodismiss="6000">
      <div class="primesoul-toast-icon">
        {% if 'success' in message.tags %}
          <i class="fas fa-check-circle"></i>
        {% elif 'error' in message.tags or 'danger' in message.tags %}
          <i class="fas fa-exclamation-circle"></i>
        {% elif 'warning' in message.tags %}
          <i class="fas fa-exclamation-triangle"></i>
        {% else %}
          <i class="fas fa-info-circle"></i>
        {% endif %}
      </div>
      <div class="primesoul-toast-body">
        {{ message }}
      </div>
      <button type="button" class="primesoul-toast-close" aria-label="Close" onclick="this.closest('.primesoul-toast').remove()">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
  {% endfor %}
</div>

<style>
.primesoul-toast-container {
  position: fixed;
  top: 76px;
  right: 20px;
  z-index: 999999;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 440px;
  width: calc(100% - 40px);
  pointer-events: none;
}
.primesoul-toast {
  pointer-events: auto;
  display: flex;
  align-items: flex-start;
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 0.9rem;
  line-height: 1.4;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  animation: primesoulToastSlideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  transition: opacity 0.3s ease, transform 0.3s ease;
  border: 1px solid transparent;
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
}
@keyframes primesoulToastSlideIn {
  from { opacity: 0; transform: translateX(50px); }
  to { opacity: 1; transform: translateX(0); }
}
.primesoul-toast-icon {
  font-size: 1.15rem;
  margin-right: 12px;
  margin-top: 1px;
  flex-shrink: 0;
}
.primesoul-toast-body {
  flex-grow: 1;
  font-weight: 500;
  word-break: break-word;
}
.primesoul-toast-close {
  background: transparent;
  border: none;
  font-size: 1.25rem;
  line-height: 1;
  opacity: 0.6;
  cursor: pointer;
  margin-left: 10px;
  padding: 0;
  color: inherit;
  transition: opacity 0.15s;
}
.primesoul-toast-close:hover {
  opacity: 1;
}

/* Color Themes with High Contrast & Visual Distinction */
.primesoul-toast-success {
  background: rgba(240, 253, 244, 0.98);
  color: #14532d;
  border-color: #86efac;
}
.primesoul-toast-success .primesoul-toast-icon { color: #16a34a; }

.primesoul-toast-error, .primesoul-toast-danger {
  background: rgba(254, 242, 242, 0.98);
  color: #7f1d1d;
  border-color: #fca5a5;
}
.primesoul-toast-error .primesoul-toast-icon, .primesoul-toast-danger .primesoul-toast-icon { color: #dc2626; }

.primesoul-toast-warning {
  background: rgba(254, 252, 232, 0.98);
  color: #713f12;
  border-color: #fde047;
}
.primesoul-toast-warning .primesoul-toast-icon { color: #d97706; }

.primesoul-toast-info {
  background: rgba(238, 242, 255, 0.98);
  color: #312e81;
  border-color: #a5b4fc;
}
.primesoul-toast-info .primesoul-toast-icon { color: #4f46e5; }

@media (max-width: 576px) {
  .primesoul-toast-container {
    top: 65px;
    right: 12px;
    left: 12px;
    width: auto;
    max-width: none;
  }
}
</style>

<script>
(function() {
  function initToastDismissal() {
    var toasts = document.querySelectorAll('.primesoul-toast[data-autodismiss]');
    toasts.forEach(function(toast) {
      var timeout = parseInt(toast.getAttribute('data-autodismiss'), 10) || 6000;
      setTimeout(function() {
        if (toast && toast.parentNode) {
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(-10px)';
          setTimeout(function() {
            if (toast && toast.parentNode) toast.remove();
          }, 300);
        }
      }, timeout);
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initToastDismissal);
  } else {
    initToastDismissal();
  }
})();
</script>
{% endif %}
