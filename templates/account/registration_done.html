{% extends 'layout.html' %}

{% block content %}
<section id="login-form-section">
  <div id="login-form-section--inner">
    <div class="container">
      <div class="row justify-content-center py-5">
        <div class="col-md-6 col-lg-5">
          <div class="card shadow-sm border-0 p-4 text-center" style="border-radius: 12px;">
            <div class="mb-3">
              <div style="width: 64px; height: 64px; border-radius: 50%; background: #ecfdf5; color: #10b981; display: inline-flex; align-items: center; justify-content: center; font-size: 2rem;">
                <i class="fas fa-check-circle"></i>
              </div>
            </div>
            <h3 class="font-weight-bold text-dark">Registration Successful</h3>
            <p class="text-muted small mb-4">
              Your account registration request has been submitted successfully. Once approved by the school administrator, you will be able to log in.
            </p>
            <div class="d-flex flex-column gap-2">
              <a href="{% url 'account_login' %}" class="btn btn-primary btn-block font-weight-bold py-2">
                <i class="fas fa-sign-in-alt mr-1"></i> Proceed to Login
              </a>
              <a href="{% url 'index_view' %}" class="btn btn-outline-secondary btn-block font-weight-bold py-2 mt-2">
                <i class="fas fa-home mr-1"></i> Back to Homepage
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
