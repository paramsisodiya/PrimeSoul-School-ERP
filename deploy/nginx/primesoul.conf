# ==============================================================================
# PrimeSoul School ERP - Production Nginx Configuration
# Multi-Tenant Domain & Subdomain Router with SSL, Caching, and Security Headers
# ==============================================================================

upstream primesoul_app {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

# 1. HTTP -> HTTPS Global Redirection
server {
    listen 80;
    listen [::]:80;
    server_name primesoul.edu.in *.primesoul.edu.in;

    # ACME Challenge for Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Production HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name primesoul.edu.in *.primesoul.edu.in;

    # SSL Certificates (Managed via Certbot)
    ssl_certificate /etc/letsencrypt/live/primesoul.edu.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/primesoul.edu.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Max upload limit (Student marksheets, admission documents, fee receipts)
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static Assets (WhiteNoise / Nginx fast-path)
    location /static/ {
        alias /var/www/primesoul/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Public Media Assets (School logos, favicons)
    location /media/tenants/ {
        alias /var/www/primesoul/media/tenants/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Private / Protected Documents (Student KYC, Aadhaar, marksheets, payroll)
    # Passed through Django application with tenant authorization checks
    location /media/ {
        proxy_pass http://primesoul_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Health Check Endpoint
    location /health/ {
        proxy_pass http://primesoul_app;
        proxy_set_header Host $host;
        access_log off;
    }

    # Main Application Proxy
    location / {
        proxy_pass http://primesoul_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }
}
